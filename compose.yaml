services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://app:local_dev_password@postgres:5432/wallet?sslmode=disable
      - up
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Tokens carry the same issuer whether they were requested from the
      # host (localhost:8081) or from inside the network (keycloak:8080).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8081:8080"

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./deploy/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      localstack:
        condition: service_healthy
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://app:local_dev_password@postgres:5432/wallet?sslmode=disable
      JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      JWT_ISSUER: http://localhost:8081/realms/wagering
      JWT_AUDIENCE: wallet-api
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_TRANSACTIONS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Reachable by Prometheus on the compose network; published on the
      # host's loopback only.
      ADMIN_ADDR: 0.0.0.0:6060
      PPROF_ENABLED: ${PPROF_ENABLED:-false}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-5s}
      DB_IDLE_IN_TRANSACTION_TIMEOUT: ${DB_IDLE_IN_TRANSACTION_TIMEOUT:-10s}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-2s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_PUBLISH_INTERVAL: ${OUTBOX_PUBLISH_INTERVAL:-2s}
      # Empty disables tracing; `make up-obs` points it at Jaeger.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-}
      OTEL_SERVICE_NAME: go-high-load-wallet
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6060:6060"

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.4
    profiles: [obs]
    depends_on:
      - prometheus
      - jaeger
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [obs]
    ports:
      - "127.0.0.1:16686:16686"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [obs]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://app:local_dev_password@postgres:5432/wallet?sslmode=disable

  k6:
    image: grafana/k6:2.3.0
    profiles: [bench]
    # Writes results as the host user so bench/results stays editable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./bench/k6:/scripts:ro
      - ./bench/data:/data:ro
      - ./bench/results:/results
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s

volumes:
  postgres_data:
